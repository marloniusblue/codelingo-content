<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CodeLingo – Spielwiese</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/codemirror.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/mode/xml/xml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/mode/css/css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/mode/htmlmixed/htmlmixed.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/mode/clike/clike.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/mode/sql/sql.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/mode/go/go.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/mode/shell/shell.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/mode/python/python.min.js"></script>

<style>
  :root {
    --bg: #14151a;
    --surface: #1c1e26;
    --surface-2: #23252f;
    --border: #2f3140;
    --text: #e7e9ee;
    --text-dim: #8a8d9c;
    --green: #58cc02;
    --green-dark: #46a302;
    --blue: #1cb0f6;
    --orange: #ff9600;
    --red: #ff4b4b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, Roboto, 'Segoe UI', sans-serif;
    touch-action: manipulation; overscroll-behavior: none;
  }
  #app { display: flex; flex-direction: column; height: 100%; }

  /* ── Sprachauswahl ─────────────────────────────────────────────── */
  #lang-row {
    display: flex; gap: 8px; padding: 10px 12px;
    overflow-x: auto; overflow-y: hidden; flex: 0 0 auto;
    background: var(--surface); border-bottom: 1px solid var(--border);
    -webkit-overflow-scrolling: touch;
  }
  #lang-row::-webkit-scrollbar { display: none; }
  .lang-chip {
    flex: 0 0 auto; padding: 7px 14px; border-radius: 999px;
    background: var(--surface-2); color: var(--text-dim);
    font-size: 13px; font-weight: 700; border: 2px solid transparent;
    cursor: pointer; user-select: none; white-space: nowrap;
  }
  .lang-chip.active {
    background: rgba(88, 204, 2, 0.15); color: var(--green);
    border-color: var(--green);
  }
  .lang-chip .tag {
    font-size: 10px; font-weight: 600; opacity: .7; margin-left: 4px;
  }

  /* ── Editor ────────────────────────────────────────────────────── */
  #editor-wrap { flex: 1 1 auto; min-height: 0; position: relative; }
  .CodeMirror { height: 100%; font-size: 14px; background: var(--bg); color: var(--text); }
  .CodeMirror-gutters { background: var(--bg); border-right: 1px solid var(--border); }
  .CodeMirror-linenumber { color: #4a4d5e; }
  .CodeMirror-cursor { border-left: 2px solid var(--green); }
  .cm-s-default .cm-keyword { color: #ff79c6; }
  .cm-s-default .cm-string { color: #f1fa8c; }
  .cm-s-default .cm-comment { color: #6a6f85; font-style: italic; }
  .cm-s-default .cm-number { color: #bd93f9; }
  .cm-s-default .cm-atom { color: #bd93f9; }
  .cm-s-default .cm-def { color: var(--blue); }
  .cm-s-default .cm-variable { color: var(--text); }
  .cm-s-default .cm-tag { color: #ff79c6; }
  .cm-s-default .cm-attribute { color: var(--blue); }

  /* ── Aktionsleiste ─────────────────────────────────────────────── */
  #action-row {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; background: var(--surface);
    border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
    flex: 0 0 auto;
  }
  button {
    font-family: inherit; border: none; border-radius: 12px;
    font-weight: 800; cursor: pointer; padding: 11px 18px; font-size: 14px;
  }
  #run-btn { background: var(--green); color: #fff; flex: 1 1 auto; }
  #run-btn:active { background: var(--green-dark); }
  #run-btn:disabled { background: #3a3d4a; color: var(--text-dim); }
  #reset-btn, #db-reset-btn {
    background: var(--surface-2); color: var(--text-dim); flex: 0 0 auto;
    padding: 11px 14px;
  }
  #status-text { font-size: 12px; color: var(--text-dim); flex: 0 0 auto; max-width: 40%; text-align: right; }

  /* ── Ausgabe ───────────────────────────────────────────────────── */
  #output-wrap { flex: 0 0 38%; min-height: 90px; overflow: hidden; display: flex; flex-direction: column; }
  #console {
    flex: 1 1 auto; overflow-y: auto; padding: 10px 14px;
    font-family: 'SF Mono', Menlo, Consolas, monospace; font-size: 13px;
    line-height: 1.5; white-space: pre-wrap; word-break: break-word;
  }
  #console .line { margin-bottom: 4px; }
  #console .line.error { color: var(--red); }
  #console .line.warn { color: var(--orange); }
  #console .line.info { color: var(--blue); }
  #console .placeholder { color: var(--text-dim); font-style: italic; }
  #preview-frame { flex: 1 1 auto; border: none; background: #fff; }
  table.sql-result { border-collapse: collapse; width: 100%; margin: 6px 0 14px; font-size: 12px; }
  table.sql-result th, table.sql-result td {
    border: 1px solid var(--border); padding: 4px 8px; text-align: left;
  }
  table.sql-result th { background: var(--surface-2); color: var(--blue); }

  #bridge-banner {
    display: none; padding: 8px 14px; font-size: 12px; text-align: center;
    background: rgba(255, 150, 0, .12); color: var(--orange);
    border-bottom: 1px solid var(--border);
  }
</style>
</head>
<body>
<div id="app">

  <div id="bridge-banner">
    ⚠️ Serverseitige Sprachen (Java, Kotlin, C#, Go, Swift, Bash, Python, TypeScript, Dart) funktionieren nur innerhalb der CodeLingo-App.
  </div>

  <div id="lang-row"></div>

  <div id="editor-wrap"><textarea id="editor-textarea"></textarea></div>

  <div id="action-row">
    <button id="reset-btn" title="Auf Beispielcode zurücksetzen">↺</button>
    <button id="db-reset-btn" title="Datenbank zurücksetzen" style="display:none;">🗑️ DB</button>
    <button id="run-btn">▶ Ausführen</button>
    <div id="status-text"></div>
  </div>

  <div id="output-wrap">
    <div id="console"><div class="line placeholder">Noch nichts ausgeführt.</div></div>
    <iframe id="preview-frame" style="display:none;" sandbox="allow-scripts"></iframe>
  </div>

</div>

<script>
(function () {
  'use strict';

  // ── Sprachdefinitionen ───────────────────────────────────────────
  // kind: 'js' | 'html' | 'css' | 'sql' | 'piston'
  // pistonLanguage: nur bei kind === 'piston' relevant, siehe
  // CodeExecutionService in der App (dieselben Bezeichner wie dort).
  var LANGUAGES = [
    { id: 'javascript', label: 'JavaScript', kind: 'js', mode: 'javascript',
      starter: 'console.log("Hallo, Welt!");' },
    { id: 'html', label: 'HTML', kind: 'html', mode: 'htmlmixed',
      starter: '<h1>Hallo, Welt!</h1>\n<p>Das ist meine erste Seite.</p>\n<button onclick="alert(\'Hi!\')">Klick mich</button>' },
    { id: 'css', label: 'CSS', kind: 'css', mode: 'css',
      starter: 'h1 {\n  color: #58cc02;\n  font-family: sans-serif;\n}\n\np {\n  color: #444;\n}\n\nbutton {\n  background: #1cb0f6;\n  color: white;\n  border: none;\n  padding: 8px 16px;\n  border-radius: 8px;\n}' },
    { id: 'sql', label: 'SQL', kind: 'sql', mode: 'text/x-sql',
      starter: 'CREATE TABLE tiere (id INTEGER PRIMARY KEY, name TEXT, art TEXT);\n\nINSERT INTO tiere (name, art) VALUES\n  (\'Bello\', \'Hund\'),\n  (\'Mimi\', \'Katze\');\n\nSELECT * FROM tiere;' },
    { id: 'java', label: 'Java', kind: 'piston', pistonLanguage: 'java', mode: 'text/x-java',
      starter: 'public class Main {\n    public static void main(String[] args) {\n        System.out.println("Hallo, Welt!");\n    }\n}' },
    { id: 'kotlin', label: 'Kotlin', kind: 'piston', pistonLanguage: 'kotlin', mode: 'text/x-kotlin',
      starter: 'fun main() {\n    println("Hallo, Welt!")\n}' },
    { id: 'csharp', label: 'C#', kind: 'piston', pistonLanguage: 'csharp', mode: 'text/x-csharp',
      starter: 'using System;\n\nclass Program {\n    static void Main() {\n        Console.WriteLine("Hallo, Welt!");\n    }\n}' },
    { id: 'go', label: 'Go', kind: 'piston', pistonLanguage: 'go', mode: 'text/x-go',
      starter: 'package main\n\nimport "fmt"\n\nfunc main() {\n    fmt.Println("Hallo, Welt!")\n}' },
    { id: 'swift', label: 'Swift', kind: 'piston', pistonLanguage: 'swift', mode: 'text/x-swift',
      starter: 'print("Hallo, Welt!")' },
    { id: 'bash', label: 'Bash', kind: 'piston', pistonLanguage: 'bash', mode: 'text/x-sh',
      starter: 'echo "Hallo, Welt!"' },
    { id: 'python', label: 'Python', kind: 'piston', pistonLanguage: 'python', mode: 'python',
      starter: 'print("Hallo, Welt!")' },
    { id: 'typescript', label: 'TypeScript', kind: 'piston', pistonLanguage: 'typescript', mode: 'text/typescript',
      starter: 'const gruss: string = "Hallo, Welt!";\nconsole.log(gruss);' },
    { id: 'dart', label: 'Dart', kind: 'piston', pistonLanguage: 'dart', mode: 'text/x-java',
      starter: 'void main() {\n  print(\'Hallo, Welt!\');\n}' }
  ];

  var STORAGE_PREFIX = 'codelingo_playground_v1_';
  var hasBridge = !!(window.FlutterBridge && typeof window.FlutterBridge.postMessage === 'function');

  var els = {
    langRow: document.getElementById('lang-row'),
    editorWrap: document.getElementById('editor-wrap'),
    runBtn: document.getElementById('run-btn'),
    resetBtn: document.getElementById('reset-btn'),
    dbResetBtn: document.getElementById('db-reset-btn'),
    statusText: document.getElementById('status-text'),
    consoleEl: document.getElementById('console'),
    previewFrame: document.getElementById('preview-frame'),
    bridgeBanner: document.getElementById('bridge-banner')
  };

  var cm = CodeMirror.fromTextArea(document.getElementById('editor-textarea'), {
    lineNumbers: true,
    mode: 'javascript',
    theme: 'default',
    indentUnit: 2,
    tabSize: 2,
    lineWrapping: false,
    autoCloseBrackets: false,
    extraKeys: { 'Ctrl-Enter': runCurrent, 'Cmd-Enter': runCurrent }
  });

  var currentLang = LANGUAGES[0];
  var currentRequestId = null;
  var sqlDb = null;        // sql.js Database-Instanz, persistiert für die Sitzung
  var sqlEnginePromise = null;

  // ── Sprachchips aufbauen ─────────────────────────────────────────
  LANGUAGES.forEach(function (lang) {
    var chip = document.createElement('div');
    chip.className = 'lang-chip';
    chip.dataset.id = lang.id;
    chip.innerHTML = lang.label + (lang.kind === 'piston' && !hasBridge ? '<span class="tag">nur App</span>' : '');
    chip.addEventListener('click', function () { switchLanguage(lang.id); });
    els.langRow.appendChild(chip);
  });

  if (!hasBridge) els.bridgeBanner.style.display = 'block';

  // ── Sprache wechseln ─────────────────────────────────────────────
  function switchLanguage(id) {
    var lang = LANGUAGES.filter(function (l) { return l.id === id; })[0];
    if (!lang) return;

    saveCurrentCode();
    currentLang = lang;

    Array.prototype.forEach.call(els.langRow.children, function (chip) {
      chip.classList.toggle('active', chip.dataset.id === id);
    });

    cm.setOption('mode', lang.mode);
    cm.setValue(loadCode(lang.id) || lang.starter);

    els.dbResetBtn.style.display = lang.kind === 'sql' ? 'inline-block' : 'none';
    resetOutputPanel();
    localStorage.setItem(STORAGE_PREFIX + 'last_lang', id);

    var disabled = lang.kind === 'piston' && !hasBridge;
    els.runBtn.disabled = disabled;
    els.runBtn.textContent = disabled ? '▶ Nur in der App verfügbar' : '▶ Ausführen';
  }

  function saveCurrentCode() {
    try { localStorage.setItem(STORAGE_PREFIX + currentLang.id, cm.getValue()); } catch (_) {}
  }
  function loadCode(id) {
    try { return localStorage.getItem(STORAGE_PREFIX + id); } catch (_) { return null; }
  }

  els.resetBtn.addEventListener('click', function () {
    cm.setValue(currentLang.starter);
  });

  // ── Ausgabe-Panel umschalten (Konsole vs. Vorschau-iframe) ────────
  function resetOutputPanel() {
    if (currentLang.kind === 'html' || currentLang.kind === 'css') {
      els.consoleEl.style.display = 'none';
      els.previewFrame.style.display = 'block';
      els.previewFrame.srcdoc = '';
    } else {
      els.previewFrame.style.display = 'none';
      els.consoleEl.style.display = 'block';
      els.consoleEl.innerHTML = '<div class="line placeholder">Noch nichts ausgeführt.</div>';
    }
    setStatus('');
  }

  function setStatus(text) { els.statusText.textContent = text || ''; }

  function appendLine(text, cls) {
    var div = document.createElement('div');
    div.className = 'line' + (cls ? ' ' + cls : '');
    div.textContent = text;
    els.consoleEl.appendChild(div);
    els.consoleEl.scrollTop = els.consoleEl.scrollHeight;
  }
  function clearConsole() { els.consoleEl.innerHTML = ''; }

  // ── Ausführen ──────────────────────────────────────────────────
  els.runBtn.addEventListener('click', runCurrent);

  function runCurrent() {
    if (els.runBtn.disabled) return;
    var code = cm.getValue();
    switch (currentLang.kind) {
      case 'js': return runJavaScript(code);
      case 'html': return runHtmlPreview(code);
      case 'css': return runCssPreview(code);
      case 'sql': return runSql(code);
      case 'piston': return runViaPiston(currentLang.pistonLanguage, code);
    }
  }

  // ── JavaScript: lokal mit umgeleiteter console ───────────────────
  function runJavaScript(code) {
    clearConsole();
    var origLog = console.log, origErr = console.error, origWarn = console.warn;
    var hadOutput = false;

    function fmt(v) {
      if (typeof v === 'string') return v;
      try { return JSON.stringify(v, null, 2); } catch (_) { return String(v); }
    }
    console.log = function () { hadOutput = true; appendLine(Array.prototype.map.call(arguments, fmt).join(' ')); origLog.apply(console, arguments); };
    console.warn = function () { hadOutput = true; appendLine(Array.prototype.map.call(arguments, fmt).join(' '), 'warn'); origWarn.apply(console, arguments); };
    console.error = function () { hadOutput = true; appendLine(Array.prototype.map.call(arguments, fmt).join(' '), 'error'); origErr.apply(console, arguments); };

    try {
      var result = new Function(code)();
      if (result !== undefined) { hadOutput = true; appendLine('⟶ ' + fmt(result)); }
    } catch (e) {
      hadOutput = true;
      appendLine(e.toString(), 'error');
    } finally {
      console.log = origLog; console.warn = origWarn; console.error = origErr;
    }
    if (!hadOutput) appendLine('Kein console.log()-Aufruf und keine Rückgabe.', null);
  }

  // ── HTML-Vorschau ─────────────────────────────────────────────
  function runHtmlPreview(code) {
    els.previewFrame.srcdoc = code;
  }

  // ── CSS-Vorschau (gegen eine feste Demo-Seite) ──────────────────
  function runCssPreview(code) {
    var demo = '<!DOCTYPE html><html><head><meta charset="utf-8">' +
      '<style>body{font-family:sans-serif;padding:16px;margin:0;}</style>' +
      '<style>' + code + '</style></head><body>' +
      '<h1>Überschrift</h1>' +
      '<p>Das ist ein Absatz mit <a href="#">einem Link</a> und etwas <em>Text</em>.</p>' +
      '<ul><li>Erster Punkt</li><li>Zweiter Punkt</li></ul>' +
      '<button>Ein Knopf</button>' +
      '<div class="box" style="width:80px;height:80px;background:#ddd;margin-top:10px;">.box</div>' +
      '</body></html>';
    els.previewFrame.srcdoc = demo;
  }

  // ── SQL über sql.js (läuft komplett lokal, kein Server nötig) ───
  function loadSqlEngine() {
    if (sqlEnginePromise) return sqlEnginePromise;
    appendLine('SQL-Engine wird geladen …', 'info');
    sqlEnginePromise = new Promise(function (resolve, reject) {
      var script = document.createElement('script');
      script.src = 'https://sql.js.org/dist/sql-wasm.js';
      script.onload = function () {
        window.initSqlJs({ locateFile: function (f) { return 'https://sql.js.org/dist/' + f; } })
          .then(resolve).catch(reject);
      };
      script.onerror = function () { reject(new Error('SQL-Engine konnte nicht geladen werden (kein Internet?).')); };
      document.head.appendChild(script);
    });
    return sqlEnginePromise;
  }

  els.dbResetBtn.addEventListener('click', function () {
    sqlDb = null;
    clearConsole();
    appendLine('Datenbank wurde zurückgesetzt.', 'info');
  });

  function runSql(code) {
    clearConsole();
    loadSqlEngine().then(function (SQL) {
      if (!sqlDb) sqlDb = new SQL.Database();
      try {
        clearConsole();
        var results = sqlDb.exec(code); // Array von {columns, values}
        if (results.length === 0) {
          appendLine('OK — keine Ergebniszeilen (z.B. CREATE/INSERT/UPDATE ausgeführt).', null);
        }
        results.forEach(function (res) { renderSqlTable(res); });
      } catch (e) {
        clearConsole();
        appendLine(e.message || e.toString(), 'error');
      }
    }).catch(function (e) {
      clearConsole();
      appendLine(e.message || e.toString(), 'error');
    });
  }

  function renderSqlTable(res) {
    var table = document.createElement('table');
    table.className = 'sql-result';
    var thead = document.createElement('tr');
    res.columns.forEach(function (c) {
      var th = document.createElement('th'); th.textContent = c; thead.appendChild(th);
    });
    table.appendChild(thead);
    res.values.forEach(function (row) {
      var tr = document.createElement('tr');
      row.forEach(function (val) {
        var td = document.createElement('td'); td.textContent = val === null ? 'NULL' : String(val);
        tr.appendChild(td);
      });
      table.appendChild(tr);
    });
    els.consoleEl.appendChild(table);
  }

  // ── Serverseitige Sprachen über FlutterBridge → Piston ──────────
  function runViaPiston(pistonLanguage, code) {
    if (!hasBridge) return;
    clearConsole();
    els.runBtn.disabled = true;
    currentRequestId = 'req_' + Date.now() + '_' + Math.random().toString(36).slice(2);
    setStatus('Wird gesendet …');
    window.FlutterBridge.postMessage(JSON.stringify({
      requestId: currentRequestId,
      language: pistonLanguage,
      code: code,
      stdin: ''
    }));
  }

  // Von der App aufgerufen (siehe PlaygroundScreen._onBridgeMessage):
  window.onExecutionStatus = function (payload) {
    if (!payload || payload.requestId !== currentRequestId) return;
    setStatus(payload.status || '');
  };
  window.onExecutionResult = function (payload) {
    if (!payload || payload.requestId !== currentRequestId) return;
    setStatus('');
    els.runBtn.disabled = currentLang.kind === 'piston' && !hasBridge;
    clearConsole();
    if (payload.errorMessage) {
      appendLine(payload.errorMessage, 'error');
    } else {
      appendLine(payload.output && payload.output.length ? payload.output : '(keine Ausgabe)',
          payload.success ? null : 'error');
    }
  };

  // ── Start ────────────────────────────────────────────────────────
  var lastLang = null;
  try { lastLang = localStorage.getItem(STORAGE_PREFIX + 'last_lang'); } catch (_) {}
  switchLanguage(lastLang && LANGUAGES.some(function (l) { return l.id === lastLang; }) ? lastLang : LANGUAGES[0].id);

  window.addEventListener('beforeunload', saveCurrentCode);
})();
</script>
</body>
</html>
